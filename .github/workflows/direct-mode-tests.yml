name: Direct Mode Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "genlayer-py==0.16.3" "genlayer-test==0.29.2" "pytest==9.1.1" numpy

      - name: Run Direct Mode tests
        run: pytest test_fund.py -v
